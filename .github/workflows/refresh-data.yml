name: Refresh market data

on:
  schedule:
    # 21:30 UTC Mon–Fri  =  5:30 PM ET (after NYSE close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to push the data files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run data refresh
        id: refresh
        run: python scripts/refresh_data.py

      # Runs even when the refresh exits non-zero. A collapse of the
      # fundamentals fetch still leaves fresh prices, RSI and OHLCV worth
      # keeping, and the script carries the valuation fields forward
      # rather than blanking them — so the data is safe to commit. The job
      # is still marked failed, which is the point: on 2026-09-30 a run
      # that lost every single Ticker.info response reported success and
      # nobody noticed until the table went blank.
      - name: Commit updated data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh market data [skip ci]"
          file_pattern: "public/**"
