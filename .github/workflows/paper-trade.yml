name: Paper trading

on:
  schedule:
    # 22:10 UTC Mon–Fri — after the US close, so the day's closing prices exist
    - cron: '10 22 * * 1-5'
  # Any push to main also advances the books. Combined with the engine's
  # backfill, this means a single commit after a pause catches every missed
  # session up — so the run survives the scheduler being interrupted.
  # The ledger commit below carries [skip ci], so this cannot loop.
  push:
    branches: [main]
  workflow_dispatch:

# Never let two runs touch the ledgers at once
concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run the session
        run: python scripts/paper_trade.py

      # Not git-auto-commit: it pushes once and fails on a non-fast-forward.
      # Another workflow committing to main while this one runs is enough to
      # lose a whole session's ledger, which has already happened. The
      # ledgers are append-only JSON written from a freshly loaded state, so
      # rebasing onto whatever landed meanwhile is safe: nothing else writes
      # paper/, and the engine backfills any session a lost push dropped.
      - name: Commit the ledgers
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/
          if git diff --cached --quiet; then
            echo "no ledger changes to commit"
            exit 0
          fi
          git commit -m "chore(paper): trading session [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing and retrying ($attempt)"
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          echo "could not push the ledgers after 5 attempts"
          exit 1
