name: Paper trading

on:
  schedule:
    # 22:10 UTC Mon–Fri — after the US close, so the day's closing prices exist
    - cron: '10 22 * * 1-5'
  workflow_dispatch:

# Never let two runs touch the ledger at once
concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run the session
        run: python scripts/paper_trade.py

      - name: Commit the ledger
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(paper): trading session [skip ci]"
          file_pattern: "paper/**"
