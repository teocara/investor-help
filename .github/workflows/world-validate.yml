name: Validate world tickers

# One-shot validation for the world large-cap additions. The session
# container's network policy reaches GitHub and the package registries and
# nothing else, so every candidate symbol is checked here and the result
# committed back. Nothing reaches the watchlist that did not resolve.

on:
  workflow_dispatch:

concurrency:
  group: world-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Validate the candidates
        run: python scripts/validate_world.py

      - name: Commit the result
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/world-candidates.json
          if git diff --cached --quiet; then
            echo "unchanged"
            exit 0
          fi
          git commit -m "chore(data): world large-cap ticker validation [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          exit 1
