name: Alarms

# Chained to the jobs it watches rather than run on its own cron, so a
# failure surfaces a minute or two after it happens instead of up to a day
# later. The daily run is the safety net for the one case chaining cannot
# see: a watched workflow that never starts at all, which is precisely
# what GitHub's 60-day schedule disabling causes.

on:
  workflow_run:
    workflows: ["Paper trading", "Refresh market data"]
    types: [completed]
  schedule:
    - cron: '47 11 * * *'          # 11:47 UTC daily, safety net
  workflow_dispatch:
    inputs:
      self_test:
        description: "Raise a deliberate test alarm to verify notifications reach you"
        type: boolean
        default: false

concurrency:
  group: alarms
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read                    # to read other workflows' run history

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The rule tests used to run HERE, as a gate in front of the
      # evaluation. On 2026-11-03 they began failing and this step
      # skipped the evaluation for twelve days, during which the momentum
      # books fell 27% and nothing was reported. A test must never be
      # able to silence the thing it is testing.
      #
      # alarms.py now runs the tests itself and raises a CRITICAL alarm
      # when they fail, while still evaluating every real rule. The step
      # below is kept only so a failing test also turns the run red, and
      # it is non-blocking.
      - name: Evaluate alarms
        env:
          GITHUB_TOKEN: ${{ secrets.ALARM_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional. Set it to an ntfy.sh topic URL, a Slack webhook or
          # anything that accepts a POST, and critical alarms are pushed
          # there as well as opening an issue. Absent, nothing breaks.
          ALARM_WEBHOOK: ${{ secrets.ALARM_WEBHOOK }}
        run: |
          if [ "${{ inputs.self_test }}" = "true" ]; then
            python scripts/alarms.py --self-test
          else
            python scripts/alarms.py
          fi

      # Reports a failing test by turning the run red. Deliberately AFTER
      # the evaluation and continue-on-error, so it can never again stop
      # alarms from being evaluated and delivered.
      - name: Report rule-test status
        continue-on-error: true
        run: python tests/test_alarms.py

      - name: Commit the alarm state
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/alarms.json
          if git diff --cached --quiet; then
            echo "no alarm state change"
            exit 0
          fi
          git commit -m "chore(alarms): state update [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          exit 1
