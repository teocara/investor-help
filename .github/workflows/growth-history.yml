name: Growth history

# One-shot data pull for the long-run growth book. The session container
# cannot reach Yahoo — the environment's network policy allows GitHub and
# the package registries and nothing else — so the fetch runs here and the
# result is committed back for the research scripts to read.
#
# Re-runnable: it overwrites the series in place. Monthly so the 30-year
# study can be re-run on fresh data without a manual dispatch.

on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 3 * *'        # 05:35 UTC on the 3rd of each month

concurrency:
  group: growth-history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch the long-history series
        run: python scripts/fetch_growth_history.py

      # Same race as paper-trade.yml: this job and that one both commit to
      # main, and whichever pushes second is rejected.
      - name: Commit the series
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/growth-history/
          if git diff --cached --quiet; then
            echo "series unchanged"
            exit 0
          fi
          git commit -m "chore(data): long-history series for the growth book [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          exit 1
